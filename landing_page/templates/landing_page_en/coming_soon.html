{% extends "landing_page/base.html" %}

{% block content %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Coming soon — Dawn (2026-10): a quiet card on linen paper,
           footer mirrors the site's night band (see faq.css #footer). */
        .coming-soon-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh; /* Adjust height */
            padding: 96px 16px 48px;
            text-align: center;
        }

        .coming-soon-content {
            width: 100%;
            max-width: 620px;
            padding: 48px 40px 40px;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-lg);
        }

        .coming-soon-content h1 {
            font-size: clamp(2.1rem, 3vw + 1rem, 2.8rem);
            margin-bottom: 0.5rem;
            color: var(--ink);
        }

        .coming-soon-content p {
            font-size: 1.15rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            color: var(--ink-soft);
        }

        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-top: 2.5rem;
            text-decoration: none;
        }

        .back-home img {
            width: 96px;
            height: 96px;
            margin-right: 0rem;
            border-radius: 50%;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s var(--ease-soft), box-shadow 0.3s var(--ease-soft);
        }

        .back-home:hover {
            text-decoration: none;
        }
        .back-home:hover img {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lift);
        }
        .back-home:focus-visible img {
            box-shadow: 0 0 0 3px var(--moss-soft), var(--shadow-soft);
        }



        /* Footer Styling — the one dark band, a forest at night */
#footer {
    margin-top: auto; /* Push the footer to the bottom */
    background: var(--night);
    color: var(--night-ink);
    padding: 40px 0 28px;
    font-family: var(--font-sans);
    text-align: center;
    width: 100%; /* Ensure full-width */
}

.footer-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
}



.footer-section {
    margin: 10px 0;
}

.footer-link {
    color: var(--night-ink);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: color 0.3s ease;
}

.footer-link:hover {
    color: var(--sun);
}

.social-icons {
    display: flex;
    justify-content: center;
    gap: 14px;
}

.social-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(243, 237, 224, 0.08);
    border: 1px solid rgba(243, 237, 224, 0.14);
    transition: background 0.3s ease, transform 0.3s var(--ease-soft);
}

.social-icon:hover {
    background: rgba(243, 237, 224, 0.16);
    transform: translateY(-2px);
}

.social-icon img {
    width: 20px;
    height: 20px;
}

.end-of-site p {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 14px;
    color: rgba(243, 237, 224, 0.6);
    margin-top: 16px;
}

@media (max-width: 768px) {
    .coming-soon-content {
        padding: 36px 20px 30px;
    }

    .social-icons {
        margin-top: 8px;
    }
}

    </style>
</head>
<body>
    <div class="coming-soon-container">
        <div class="coming-soon-content">
            <h1><span class="underline">Coming Soon</span></h1>
            <p>We're working hard to bring you something amazing.<br>Stay tuned for updates.</p>
            <a class="back-home" href="/">
                <img src="/static/images/logo.png" alt="Home Icon">
            </a>
        </div>
    </div>

{% load static %}
    <footer id="footer">
        <div class="footer-content">

            <!-- Social Media Icons -->
            <div class="footer-section social-icons">
                <a href="https://www.instagram.com/reconnect.course" target="_blank" class="social-icon instagram">
                    <img src="{% static 'images/instagram_icon.png' %}" alt="Instagram">
                </a>
                <a href="https://www.youtube.com/@re-connect./featured" target="_blank" class="social-icon youtube">
                    <img src="{% static 'images/youtube_icon.png' %}" alt="YouTube">
                </a>
                <a href="https://www.facebook.com/Reconnect.Course" target="_blank" class="social-icon facebook">
                    <img src="{% static 'images/facebook_icon.png' %}" alt="Facebook">
                </a>
                <a href="https://www.tiktok.com/@reconnect.course" target="_blank" class="social-icon tiktok">
                    <img src="{% static 'images/tiktok_icon.png' %}" alt="TikTok">
                </a>
            </div>

            <!-- Copyright Information -->
            <div class="footer-section end-of-site">
                <p>Re-Connect © 2024 All Rights Reserved</p>
            </div>
        </div>
    </footer>
</body>
</html>

{% endblock %}
