{% extends "landing_page/base.html" %}

{% block content %}

<div class="contact-container">
    {% load static %}
    <div class="logo-animation">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
    </div>

    <div class="form-section">
        <h1>Contact Us</h1>

        <p>If you have any questions, feedback, or inquiries, feel free to reach out to us using the form below. We look forward to hearing from you!</p>

        <form action="{% url 'send_email' %}" method="post" class="contact-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required class="form-control">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required class="form-control">
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="Enter the subject" required class="form-control">
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Enter your message" rows="5" required class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>

<style>
/* Contact — Dawn (2026-10): a letter card on linen paper.
   Rules are scoped to .contact-container so the global nav / login modal keep their own styles. */
body {
    background: var(--paper);
    color: var(--ink-soft);
    font-family: var(--font-sans);
    text-align: center;
    padding: 0px;
}

    .contact-container {
        max-width: 640px;
        margin: 0 auto;
        padding: 96px 16px 72px;
        position: relative;
    }

    .contact-container .form-section {
        background-color: var(--surface);
        padding: 36px 40px 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        margin-top: 8px;
    }

    .contact-container .logo-animation {
        margin-bottom: 8px;
    }

    .contact-container .logo {
        max-width: 120px;
        border-radius: 50%;
        box-shadow: var(--shadow-soft);
        animation: fadeInOut 8.7s ease-in-out infinite;
    }

    @keyframes fadeInOut {
        0%, 100% {
            opacity: 0.55;
        }
        50% {
            opacity: 1;
        }
    }
    @media (prefers-reduced-motion: reduce) {
        .contact-container .logo { animation: none; }
    }
    html[data-motion="lite"] .contact-container .logo { animation: none; }

    .contact-container .contact-form {
        margin-top: 24px;
    }

    .contact-container .form-group {
        margin-bottom: 18px;
        text-align: left;
    }

    .contact-container label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--ink);
    }

    .contact-container input[type="text"],
    .contact-container input[type="email"],
    .contact-container textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background-color: var(--surface);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 1rem;
        line-height: 1.5;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .contact-container textarea {
        resize: vertical;
        min-height: 140px;
    }

    .contact-container input[type="text"]:focus,
    .contact-container input[type="email"]:focus,
    .contact-container textarea:focus {
        outline: none;
        border-color: var(--moss);
        box-shadow: 0 0 0 3px var(--moss-soft);
    }

    .contact-container input::placeholder,
    .contact-container textarea::placeholder {
        color: var(--ink-faint);
    }

    .contact-container button[type="submit"] {
        width: 100%;
        margin-top: 6px;
        padding: 13px 20px;
        background: var(--clay);
        color: #fff;
        font-family: var(--font-sans);
        font-size: 1.05rem;
        font-weight: 600;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.25s var(--ease-soft), transform 0.25s var(--ease-soft);
    }

    .contact-container button[type="submit"]:hover {
        background: var(--clay-deep);
    }
    .contact-container button[type="submit"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--clay-soft);
    }

    .contact-container h1 {
        margin-bottom: 10px;
        font-size: clamp(2rem, 3vw + 1rem, 2.8rem);
        color: var(--ink);
    }

    .contact-container p {
        font-size: 1.08rem;
        margin-bottom: 8px;
        color: var(--ink-soft);
    }


    /* Media query for mobile devices (adjust breakpoint as needed) */
@media (max-width: 768px) { /* Example breakpoint for tablets and smaller */
    body {
        font-size: 16px; /* Adjust base font size for better readability */
    }
    .nav-center {
        margin-right: 0; /* Remove right margin on mobile */
    }

    .contact-container {
        max-width: 100%;
        padding: 72px 16px 48px;
    }

    .dropdown-content a {
        font-size: 0.83em;
    }
    .contact-container .form-section {
        padding: 24px 18px 26px;
        margin-top: 8px;
    }

    .contact-container .logo {
        margin-top: 1rem;
        max-width: 92px; /* Adjust logo size */
    }

    .contact-container h1 {
        font-size: 2rem;
    }

    .contact-container p {
        font-size: 1rem;
        margin: 0 0 8px;
    }

#loginBtn {
    display: none;
    }
}

</style>

{% endblock %}
